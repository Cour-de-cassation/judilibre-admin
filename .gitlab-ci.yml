# Template de .gitlab-ci.yml qui provient d'ops-automation
include:
  - project: 'cour-de-cassation/ops-automation'
    file: 'template/gitlab-ci-template.yml'
    ref: 'master'

variables:
  # Le dernier étage du Dockerfile est "local" (développement), et Docker prend
  # le dernier étage comme cible par défaut : il faut donc cibler explicitement
  # l'étage de production.
  DOCKER_BUILD_ARGS: '--target=production'

# ──────────────────────────────────────────────────────────────────────────────
# Production publique (Scaleway) — volontairement absente de ce fichier
#
# Mesuré le 12/08/2026. Scaleway n'expose son plan de contrôle Kubernetes que
# sur le port 6443, et deux portes s'y opposent depuis le réseau interne :
#
#   1. Notre propre Squid (10.227.10.194:3128) refuse le CONNECT vers 6443 —
#      403 ERR_ACCESS_DENIED, journalisé en TCP_DENIED/HIER_NONE, donc décidé
#      localement sans consulter le parent. C'est la règle Ubuntu par défaut
#      http_access deny CONNECT !SSL_ports. Celle-là, on saurait la lever.
#
#   2. Le proxy du RIE (100.78.184.201:8080), lui, autorise le port : il résout
#      les noms et tente les connexions. Vers le plan de contrôle Kapsule sur
#      6443, il attend son propre délai puis rend un 502 au bout de 37 secondes.
#      Il a donc essayé, et n'a pas pu joindre la cible. Or ce même point de
#      terminaison accorde une poignée de main TLS en moins d'une seconde depuis
#      l'Internet ouvert : la cible est vivante, c'est le chemin qui manque.
#
# La seconde porte n'est donc pas une règle de proxy mais un filtrage de sortie,
# au-delà du RIE. Elle n'est pas la nôtre, et elle suffit à condamner la voie.
#
# Aucun job GitLab ne peut donc piloter ces clusters. Le sens inverse est tout
# aussi fermé : un agent installé dans le cluster n'aurait aucune route vers ce
# GitLab, qui vit en 10.227.10.197. Les déploiements publics restent donc sur
# GitHub Actions, dont les runners ont une sortie libre.
#
# Deux jobs ont été retirés le 12/08/2026 à la lumière de ce constat :
#
#   - deploy_staging, qui visait un cluster Scaleway depuis un runner interne.
#     Il n'a jamais pu aboutir et ne le pourrait pas, quel que soit
#     l'environnement visé — le mur des 6443 vaut pour tous les plans de
#     contrôle Kapsule. Un job qui ne peut pas réussir coûte plus cher qu'un job
#     absent : quelqu'un finit par le lancer et par chercher pourquoi il expire.
#
#   - check_if_image_is_on_dockerhub, qui n'existait que pour le précéder. La
#     chaîne privée construit sa propre image dans le registry GitLab interne et
#     n'a que faire de celle de Docker Hub.
#
# La variable PUBLIC_IMAGE est partie avec eux. L'historique Git les conserve :
# si le flux s'ouvre un jour, un git revert suffit à les ramener.
#
# Pour rouvrir la question, il faudrait DEUX ouvertures, dans cet ordre :
#   1. un flux sortant vers 163.172.133.65:6443, plus généralement vers les
#      plans de contrôle *.api.k8s.fr-par.scw.cloud. C'est une règle de
#      pare-feu, pas une ACL de proxy — le RIE, lui, laisse déjà passer la
#      demande. Demande bloquante, et hors de notre main ;
#   2. chez nous, dans le rôle installer_proxy_externe : étendre les ACL
#      Safe_ports et SSL_ports au port 6443, en le restreignant à ce domaine.
#      Attention, ce rôle lance aussi un apt upgrade et réécrit le netplan de la
#      VM du proxy — il ne se rejoue pas à la légère, et il ne recharge jamais
#      Squid faute de handler.
# ──────────────────────────────────────────────────────────────────────────────
