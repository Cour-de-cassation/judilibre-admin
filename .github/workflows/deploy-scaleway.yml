name: Déploiement sur Scaleway

# Rétablit les déploiements publics supprimés le 12/06/2026 avec push.yml, mais
# sans réintroduire judilibre-ops : ce qui est lancé ici est le rôle Ansible du
# dépôt, celui-là même qui déploie les trois clusters privés.
#
# Pourquoi GitHub et non GitLab : le plan de contrôle Kubernetes de Scaleway
# n'écoute que sur 6443, et aucun flux ne mène du réseau interne à ce port.
# Mesuré le 12/08/2026, détail en tête de .gitlab-ci.yml. Les runners GitHub,
# eux, ont une sortie libre.
#
# Manuel, comme l'était push.yml — dont le déclencheur sur push était déjà
# commenté avant sa suppression. Un déploiement en production ne part pas seul.
#
# Périmètre : ce workflow ne gère QUE le Deployment de l'application. Créer les
# objets d'un cluster — namespace, Secrets, Elasticsearch, Ingress, LoadBalancer,
# certificats — reste l'affaire de judilibre-ops, via create_environment.sh, que
# create-infra-test.yaml rejoue chaque samedi sur un environnement jetable. Ne
# pas dupliquer cette capacité ici : elle existe, et elle est éprouvée toutes les
# semaines. Pour reconstruire un vrai cluster, lancer ce script à la main avec le
# fichier d'environnement correspondant.

on:
  workflow_dispatch:
    inputs:
      version:
        # Les images publiées par tag.yml portent le nom du tag Git : 0.0.7 au
        # 29/06/2026. Attention, cette numérotation est plus basse que celle de
        # package.json (0.1.4) et que celle des images historiques
        # d'opendatajustice (0.1.4-<empreinte>) — un déploiement fait donc
        # reculer le numéro affiché. À corriger côté convention de tags.
        description: "Étiquette de l'image sur Docker Hub judilibre/judilibre-admin (ex. 0.0.7)"
        required: true
        type: string
      target:
        description: "Cluster visé"
        required: true
        type: choice
        default: dev-par1
        options:
          - dev-par1
          - prod-par1
          - prod-par2
          - prod-les-deux

env:
  # Épinglées : une version d'ansible-core ou de la collection qui change sous
  # nos pieds est un déploiement qui casse sans qu'aucun commit n'ait bougé.
  ANSIBLE_VERSION: "2.17.6"
  KUBERNETES_COLLECTION_VERSION: "5.0.0"

jobs:
  dev_par1:
    name: 🚀 dev-par1
    if: inputs.target == 'dev-par1'
    runs-on: ubuntu-latest
    environment: scw-dev-par1
    steps:
      - uses: actions/checkout@v4

      - name: Outillage Ansible
        uses: ./.github/actions/setup-ansible
        with:
          ansible-version: ${{ env.ANSIBLE_VERSION }}
          collection-version: ${{ env.KUBERNETES_COLLECTION_VERSION }}

      - name: Kubeconfig
        env:
          KUBE_CA: ${{ secrets.KUBE_SCW_CA }}
          KUBE_NAME: ${{ secrets.KUBE_SCW_NAME }}
          KUBE_TOKEN: ${{ secrets.KUBE_SCW_TOKEN }}
          KUBE_URL: ${{ secrets.KUBE_SCW_URL }}
          KUBE_USER: ${{ secrets.KUBE_SCW_USER }}
        run: .github/scripts/build-kubeconfig.sh

      - name: Déploiement
        id: deploiement
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          IMAGE: ${{ secrets.JUDILIBRE_DOCKERHUB_USERNAME }}/judilibre-admin:${{ inputs.version }}
        run: .github/scripts/deploy-scaleway.sh scw_dev_par1

      # Les sondes du pod ne prouvent que sa santé interne. Ce contrôle-ci passe
      # par l'URL publique : Ingress, certificat, LoadBalancer, authentification.
      - name: Contrôle de bout en bout
        id: controle
        env:
          APP_HOST: admin.dev-par1.judilibre.io
          HTTP_PASSWD: ${{ secrets.HTTP_PASSWD }}
        run: .github/scripts/verify-public.sh

      - name: Retour arrière
        if: failure() && (steps.deploiement.outcome == 'failure' || steps.controle.outcome == 'failure')
        env:
          NAMESPACE: judilibre-scw-dev-par1-dev
        run: .github/scripts/rollback.sh

  prod_par1:
    name: 🚀 prod-par1
    if: inputs.target == 'prod-par1' || inputs.target == 'prod-les-deux'
    runs-on: ubuntu-latest
    environment: scw-prod-par1
    steps:
      - uses: actions/checkout@v4

      - name: Outillage Ansible
        uses: ./.github/actions/setup-ansible
        with:
          ansible-version: ${{ env.ANSIBLE_VERSION }}
          collection-version: ${{ env.KUBERNETES_COLLECTION_VERSION }}

      - name: Kubeconfig
        env:
          KUBE_CA: ${{ secrets.KUBE_SCW_CA_PROD_PAR1 }}
          KUBE_NAME: ${{ secrets.KUBE_SCW_NAME_PROD_PAR1 }}
          KUBE_TOKEN: ${{ secrets.KUBE_SCW_TOKEN_PROD_PAR1 }}
          KUBE_URL: ${{ secrets.KUBE_SCW_URL_PROD_PAR1 }}
          KUBE_USER: ${{ secrets.KUBE_SCW_USER_PROD_PAR1 }}
        run: .github/scripts/build-kubeconfig.sh

      - name: Déploiement
        id: deploiement
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          IMAGE: ${{ secrets.JUDILIBRE_DOCKERHUB_USERNAME }}/judilibre-admin:${{ inputs.version }}
        run: .github/scripts/deploy-scaleway.sh scw_prod_par1

      # Les sondes du pod ne prouvent que sa santé interne. Ce contrôle-ci passe
      # par l'URL publique : Ingress, certificat, LoadBalancer, authentification.
      - name: Contrôle de bout en bout
        id: controle
        env:
          APP_HOST: admin.prod-par1.judilibre.io
          HTTP_PASSWD: ${{ secrets.HTTP_PASSWD_PROD }}
        run: .github/scripts/verify-public.sh

      - name: Retour arrière
        if: failure() && (steps.deploiement.outcome == 'failure' || steps.controle.outcome == 'failure')
        env:
          NAMESPACE: judilibre-scw-prod-par1-master
        run: .github/scripts/rollback.sh

  prod_par2:
    name: 🚀 prod-par2
    # Le second site n'est touché qu'après le premier : si par1 échoue, par2
    # reste sur la version précédente et le service public tient toujours.
    # `always()` est nécessaire pour que le job reste éligible quand prod_par1
    # a été ignoré — cas d'un déploiement visant par2 seul.
    needs: prod_par1
    if: >-
      always() &&
      (inputs.target == 'prod-par2' ||
       (inputs.target == 'prod-les-deux' && needs.prod_par1.result == 'success'))
    runs-on: ubuntu-latest
    environment: scw-prod-par2
    steps:
      - uses: actions/checkout@v4

      - name: Outillage Ansible
        uses: ./.github/actions/setup-ansible
        with:
          ansible-version: ${{ env.ANSIBLE_VERSION }}
          collection-version: ${{ env.KUBERNETES_COLLECTION_VERSION }}

      - name: Kubeconfig
        env:
          KUBE_CA: ${{ secrets.KUBE_SCW_CA_PROD_PAR2 }}
          KUBE_NAME: ${{ secrets.KUBE_SCW_NAME_PROD_PAR2 }}
          KUBE_TOKEN: ${{ secrets.KUBE_SCW_TOKEN_PROD_PAR2 }}
          KUBE_URL: ${{ secrets.KUBE_SCW_URL_PROD_PAR2 }}
          KUBE_USER: ${{ secrets.KUBE_SCW_USER_PROD_PAR2 }}
        run: .github/scripts/build-kubeconfig.sh

      - name: Déploiement
        id: deploiement
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          IMAGE: ${{ secrets.JUDILIBRE_DOCKERHUB_USERNAME }}/judilibre-admin:${{ inputs.version }}
        run: .github/scripts/deploy-scaleway.sh scw_prod_par2

      # Les sondes du pod ne prouvent que sa santé interne. Ce contrôle-ci passe
      # par l'URL publique : Ingress, certificat, LoadBalancer, authentification.
      - name: Contrôle de bout en bout
        id: controle
        env:
          APP_HOST: admin.prod-par2.judilibre.io
          HTTP_PASSWD: ${{ secrets.HTTP_PASSWD_PROD }}
        run: .github/scripts/verify-public.sh

      - name: Retour arrière
        if: failure() && (steps.deploiement.outcome == 'failure' || steps.controle.outcome == 'failure')
        env:
          NAMESPACE: judilibre-scw-prod-par2-master
        run: .github/scripts/rollback.sh
