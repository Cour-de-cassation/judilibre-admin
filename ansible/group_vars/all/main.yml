---
# Connexion Ansible
ansible_user: ops
ansible_python_interpreter: "/home/{{ ansible_user }}/ansible_venv/bin/python"

# Proxy de sortie, utilisé par le playbook de la plateforme publique.
http_proxy_dev: "{{ vault_dev_http_proxy }}"
https_proxy_dev: "{{ vault_dev_https_proxy }}"

# L'identité et le dimensionnement de judilibre-admin sont portés par les
# défauts du rôle (ansible/roles/judilibre_admin/defaults/).
# Ne redéfinir ici que ce qui doit valoir pour tous les environnements.
