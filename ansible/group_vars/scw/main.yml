---
# Réglages communs aux trois clusters publics Scaleway.
# Les valeurs propres à chaque cluster vivent dans group_vars/scw_<zone>/.

# group_vars/all impose l'interpréteur du venv des VM privées, absent d'un
# runner où ce playbook s'exécute en local.
ansible_python_interpreter: "{{ ansible_playbook_python }}"

# ── Périmètre ─────────────────────────────────────────────────────────────────
# Même empreinte que les autres dépôts applicatifs de la plateforme : une
# application possède son namespace, son Service et son Deployment.
#
# Le Service surtout : il partage le sélecteur `app` avec le Deployment. Séparés
# entre deux dépôts, un label modifié d'un côté et pas de l'autre laisse le
# Service ne plus rien sélectionner, sans que rien ne le signale.
judilibre_admin_manage_namespace: true
judilibre_admin_manage_service: true

# L'Ingress, et donc sa whitelist IP, est géré ici : sans cela, la whitelist
# n'était plus réappliquée depuis la refonte CI/CD de juillet 2026.
# La whitelist elle-même n'est pas dans ce dépôt, qui est public : elle vient
# de judilibre-ops/scripts/whitelist-admin.sh, lu par deploy-scaleway.sh.
judilibre_admin_manage_ingress: true

# L'accès à Elasticsearch (utilisateur judilibre_admin, son rôle, l'URL de
# connexion) et le mot de passe HTTP sont gérés ici, depuis le vault de chaque
# cluster (group_vars/scw_<zone>/vault.yml) : admin n'utilise plus le
# superutilisateur elastic.
judilibre_admin_manage_es_access: true

# Mots de passe propres à chaque cluster, chiffrés dans
# group_vars/scw_<zone>/vault.yml (convention vault_* du dépôt).
judilibre_admin_es_password: "{{ vault_judilibre_admin_es_password }}"
judilibre_admin_http_password: "{{ vault_judilibre_admin_http_password }}"

# Restent chez judilibre-ops : les certificats TLS (cert-manager),
# l'Elasticsearch, le LoadBalancer, l'issuer ACME et le DNS.
#
# Aucun ConfigMap n'existe sur ces clusters : la configuration non sensible est
# posée dans le Deployment, ce que judilibre_admin_extra_env reproduit.
judilibre_admin_manage_config: false

# ── Service ───────────────────────────────────────────────────────────────────
# Nom et port de l'existant, à respecter : l'Ingress vise ce Service par son nom
# et le publie sur 80. Le targetPort suit judilibre_admin_app_port.
judilibre_admin_service_name: judilibre-admin-svc
judilibre_admin_service_port: 80

# ── Conteneur ─────────────────────────────────────────────────────────────────
# 8080 ici, contre 8000 en privé : c'est l'API_PORT des workflows historiques.
judilibre_admin_app_port: 8080

# Déjà le cas aujourd'hui sur ces clusters — le désactiver serait une régression.
judilibre_admin_read_only_root_fs: true

# Aucune demande ni limite, comme aujourd'hui. En poser sans fixer NODE_OPTIONS
# en même temps exposerait à des OOMKills, V8 dimensionnant son tas d'après la
# limite du conteneur. Sujet à traiter pour lui-même.
judilibre_admin_resources: {}

# ── Configuration injectée ────────────────────────────────────────────────────
# Reprise de k8s/deployment.yaml de judilibre-ops. Les deux Secrets référencés
# (judilibre_admin_es_auth_secret, judilibre_admin_http_passwd_secret) sont
# créés par ce rôle, cf. create_es_access.yml.
judilibre_admin_es_ca_secret: judilibre-es-http-certs-public

judilibre_admin_extra_env:
  - name: ELASTIC_NODE
    valueFrom:
      secretKeyRef:
        name: "{{ judilibre_admin_es_auth_secret }}"
        key: elastic-node
  - name: HTTP_PASSWD
    valueFrom:
      secretKeyRef:
        name: "{{ judilibre_admin_http_passwd_secret }}"
        key: http-passwd
  - name: ELASTIC_INDEX
    value: "{{ judilibre_admin_elastic_index }}"
  - name: TRANSACTION_INDEX
    value: "{{ judilibre_admin_transaction_index }}"
  - name: ELASTIC_CERT
    value: /etc/elasticsearch/certificates/ca.crt

# L'autorité de certification d'Elasticsearch, générée par l'opérateur ECK.
judilibre_admin_extra_volumes:
  - name: cert-ca
    secret:
      secretName: "{{ judilibre_admin_es_ca_secret }}"

judilibre_admin_extra_volume_mounts:
  - name: cert-ca
    mountPath: /etc/elasticsearch/certificates
    readOnly: true

# 180 s est trop court ici : la startupProbe accorde déjà 60 s, plus le tirage
# d'une image froide. Kubernetes, lui, attend 600 s avant de déclarer l'échec.
judilibre_admin_wait_timeout: 300
