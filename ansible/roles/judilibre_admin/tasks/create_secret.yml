---
# no_log : sans lui, une erreur du module afficherait le contenu du Secret
# (mot de passe HTTP et URL Elasticsearch avec ses identifiants) dans le job CI.
- name: Création du Secret de {{ judilibre_admin_app_id }}
  no_log: true
  kubernetes.core.k8s:
    apply: true
    state: present
    kubeconfig: "{{ kubeconfig_path | default(omit) }}"
    validate_certs: "{{ k8s_validate_certs | default(true) }}"
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ judilibre_admin_app_id }}-secret"
        namespace: "{{ judilibre_admin_namespace }}"
        labels:
          app: "{{ judilibre_admin_app_id }}"
      type: Opaque
      # stringData : Kubernetes se charge de l'encodage base64.
      stringData: "{{ judilibre_admin_secrets }}"
