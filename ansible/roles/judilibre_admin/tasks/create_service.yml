---
- name: Création du Service {{ judilibre_admin_app_id }}
  kubernetes.core.k8s:
    apply: true
    state: present
    kubeconfig: "{{ kubeconfig_path | default(omit) }}"
    validate_certs: "{{ k8s_validate_certs | default(true) }}"
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: "{{ judilibre_admin_service_name }}"
        namespace: "{{ judilibre_admin_namespace }}"
        labels:
          app: "{{ judilibre_admin_app_id }}"
      spec:
        type: ClusterIP
        selector:
          app: "{{ judilibre_admin_app_id }}"
        ports:
          - name: http
            protocol: TCP
            # Le port exposé et le port du conteneur peuvent différer : la
            # plateforme publique publie sur 80 et vise 8080.
            port: "{{ judilibre_admin_service_port | int }}"
            targetPort: "{{ judilibre_admin_app_port | int }}"
