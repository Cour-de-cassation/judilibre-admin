---
# Valeurs de repli du rôle. Un environnement ne redéfinit que ce qui lui est
# propre (cf. group_vars/<environnement>/main.yml) : tout le reste vient d'ici.

# ── Identité ──────────────────────────────────────────────────────────────────
judilibre_admin_namespace: judilibre
judilibre_admin_app_id: judilibre-admin
judilibre_admin_app_port: 8000

# ── Index Elasticsearch ───────────────────────────────────────────────────────
judilibre_admin_elastic_index: judilibre_0
judilibre_admin_transaction_index: transaction_0

# ── Dimensionnement ───────────────────────────────────────────────────────────
judilibre_admin_replicas: 1
judilibre_admin_cpu_request: 200m
judilibre_admin_cpu_limit: 500m
judilibre_admin_memory_request: 512Mi
judilibre_admin_memory_limit: 1Gi

# Plafond du tas V8. Node dimensionne son "old space" à environ 50 % de la
# limite mémoire du conteneur ; on le fixe explicitement à ~75 % de la limite,
# le reste servant à la mémoire hors tas. L'application accepte des corps JSON
# de 50 Mo, dont la désérialisation occupe plusieurs fois leur taille : c'est ce
# couple (limite mémoire, plafond de tas) qu'il faut réviser si un import
# volumineux échoue sur "JavaScript heap out of memory".
judilibre_admin_node_max_old_space_mb: 768

# ── Déploiement ───────────────────────────────────────────────────────────────
# L'image du Dockerfile déclare `USER node`. Kubernetes ne sait pas vérifier
# qu'un utilisateur désigné par son nom est non-root : sans UID numérique
# explicite, `runAsNonRoot: true` fait échouer le démarrage du pod.
judilibre_admin_run_as_user: 1000
judilibre_admin_run_as_group: 1000

# Délai maximum accordé au Deployment pour devenir disponible.
judilibre_admin_wait_timeout: 180

# ── Périmètre du rôle ─────────────────────────────────────────────────────────
# Quels objets le rôle crée. Tout, par défaut ; un environnement dont certains
# objets sont posés ailleurs les désactive plutôt que de les réécrire.
judilibre_admin_manage_namespace: true
judilibre_admin_manage_config: true
judilibre_admin_manage_service: true

# L'Ingress n'est géré que là où il est nginx (plateforme publique) : en privé,
# l'exposition passe par Traefik et n'est pas du ressort de ce rôle.
judilibre_admin_manage_ingress: false

# ── Ingress ──────────────────────────────────────────────────────────────────────────────
# Utilisé seulement si judilibre_admin_manage_ingress est vrai.
judilibre_admin_ingress_name: "{{ judilibre_admin_app_id }}-route"
judilibre_admin_ingress_body_size: 50m
judilibre_admin_ingress_forbidden_redirect: https://www.courdecassation.fr

# Liste de {host, tls_secret}. Le premier est l'hôte principal.
judilibre_admin_ingress_hosts: []

# Whitelist IP, séparée par des virgules, fournie en extra-var par l'appelant.
# Vide par défaut : le rôle refuse alors de créer l'Ingress.
judilibre_admin_ingress_whitelist: ""

# Accès à Elasticsearch (utilisateur, rôle, URL de connexion) et mot de passe
# HTTP, gérés par le rôle là où il en est la source de vérité (plateforme
# publique). En privé, ces valeurs passent par judilibre_admin_secrets.
judilibre_admin_manage_es_access: false

# ── Accès Elasticsearch ───────────────────────────────────────────────────────
# Utilisé seulement si judilibre_admin_manage_es_access est vrai. Les mots de
# passe (judilibre_admin_es_password, judilibre_admin_http_password) viennent
# du vault du cluster, sans valeur de repli.
judilibre_admin_es_cluster_name: judilibre
judilibre_admin_es_host: "{{ judilibre_admin_es_cluster_name }}-es-http"
judilibre_admin_es_username: judilibre_admin
judilibre_admin_es_role_name: judilibre_admin
judilibre_admin_es_user_secret: "{{ judilibre_admin_app_id }}-es-user"
judilibre_admin_es_role_secret: "{{ judilibre_admin_app_id }}-es-role"
judilibre_admin_es_auth_secret: "{{ judilibre_admin_app_id }}-es-path-with-auth"
judilibre_admin_http_passwd_secret: "{{ judilibre_admin_app_id }}-http-passwd"

# Essais espacés de 10 s avant de renoncer à basculer l'URL de connexion.
judilibre_admin_es_auth_retries: 30

# Droits strictement nécessaires à l'application : import et suppression en
# bulk, update et updateByQuery, gestion des templates (refresh_template).
# Ni suppression d'index, ni manage, ni gestion de la sécurité.
judilibre_admin_es_role_definition:
  cluster:
    - monitor
    - manage_index_templates
  indices:
    - names:
        - "{{ judilibre_admin_elastic_index | regex_replace('_[0-9]+$', '') }}_*"
        - "{{ judilibre_admin_transaction_index }}"
      privileges:
        - read
        - write
        - create_index
        - view_index_metadata

# ── Injection de configuration ────────────────────────────────────────────────
# Par défaut, un ConfigMap et un Secret injectés en bloc par envFrom. Là où les
# valeurs viennent de Secrets préexistants, extra_env les référence clé par clé,
# et extra_volumes monte ce qu'il faut. Une liste vide est un no-op valide côté
# API, ce qui évite tout rendu conditionnel dans le manifeste.
judilibre_admin_extra_env: []
judilibre_admin_extra_volumes: []
judilibre_admin_extra_volume_mounts: []

# Laissé à false tant que ce n'est pas vérifié sur un environnement : l'activer
# sans essai casserait toute écriture temporaire de l'application.
judilibre_admin_read_only_root_fs: false

# Construits ici plutôt que dans le manifeste : une expression unique se lit
# mieux qu'un bloc `when` au milieu d'une définition Kubernetes.
judilibre_admin_env_from: >-
  {{ [{'configMapRef': {'name': judilibre_admin_app_id ~ '-config'}},
      {'secretRef': {'name': judilibre_admin_app_id ~ '-secret'}}]
     if judilibre_admin_manage_config else [] }}

# Les empreintes ne valent que si le rôle gère lui-même le ConfigMap et le
# Secret ; ailleurs, elles porteraient sur des variables inexistantes.
# Celle de l'accès Elasticsearch redémarre l'application quand un mot de passe
# change : sans elle, le pod garderait les anciennes valeurs.
judilibre_admin_pod_annotations: >-
  {{ ({'checksum/config': judilibre_admin_config | to_json(sort_keys=true) | hash('sha1'),
       'checksum/secret': judilibre_admin_secrets | to_json(sort_keys=true) | hash('sha1')}
      if judilibre_admin_manage_config else {})
     | combine({'checksum/es-access': [judilibre_admin_es_username, judilibre_admin_es_password,
                                       judilibre_admin_http_password] | to_json | hash('sha1')}
               if judilibre_admin_manage_es_access else {}) }}

# Regroupées en une variable : un environnement peut n'en déclarer aucune, un
# dict vide se rendant en `resources: {}` que l'API accepte sans rien appliquer.
judilibre_admin_resources:
  requests:
    memory: "{{ judilibre_admin_memory_request }}"
    cpu: "{{ judilibre_admin_cpu_request }}"
  limits:
    memory: "{{ judilibre_admin_memory_limit }}"
    cpu: "{{ judilibre_admin_cpu_limit }}"

# ── Service ───────────────────────────────────────────────────────────────────
# Nom et port variables : un environnement peut exposer un Service déjà nommé
# autrement, visé par un Ingress qui le désigne ainsi.
judilibre_admin_service_name: "{{ judilibre_admin_app_id }}-service"
judilibre_admin_service_port: "{{ judilibre_admin_app_port }}"

# ── Contenu injecté dans le conteneur ─────────────────────────────────────────
# Configuration non sensible : ConfigMap. Les valeurs d'un ConfigMap doivent
# être des chaînes côté API Kubernetes, d'où les `| string`.
judilibre_admin_config:
  APP_ID: "{{ judilibre_admin_app_id }}"
  API_PORT: "{{ judilibre_admin_app_port | string }}"
  ELASTIC_INDEX: "{{ judilibre_admin_elastic_index }}"
  TRANSACTION_INDEX: "{{ judilibre_admin_transaction_index }}"
  NODE_OPTIONS: "--max-old-space-size={{ judilibre_admin_node_max_old_space_mb }}"

# Secrets : Secret. Définis par environnement, sans valeur de repli — un
# environnement qui les oublie doit échouer, pas hériter d'un mot de passe.
judilibre_admin_secrets:
  HTTP_PASSWD: "{{ judilibre_admin_http_password }}"
  ELASTIC_NODE: "{{ judilibre_admin_elastic_node }}"
